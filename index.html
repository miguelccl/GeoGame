<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Horizonte de Eventos Suprema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseBridge = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        body { background: #050508; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
        .cyber-panel { background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 255, 0.2); }
        .neon-text { text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        .gradient-glow { background: radial-gradient(circle at center, rgba(139, 92, 246, 0.2) 0%, transparent 70%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="fixed inset-0 pointer-events-none gradient-glow"></div>

    <div id="app-container" class="w-full max-w-4xl z-10">
        <div id="main-view" class="cyber-panel p-8 rounded-3xl shadow-2xl transition-all duration-500">
            <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 text-center font-orbitron mb-2">HORIZONTE DE EVENTOS</h1>
            <p class="text-center text-cyan-200/60 uppercase tracking-widest text-sm mb-10">Simulador Astrofísico Tático v9.2</p>

            <div id="content" class="grid md:grid-cols-2 gap-6">
                <button onclick="iniciarJogo('solo')" class="p-6 border border-cyan-500/30 rounded-2xl hover:bg-cyan-950/20 transition group">
                    <i data-lucide="terminal" class="w-10 h-10 text-cyan-400 mb-4 group-hover:scale-110 transition"></i>
                    <h2 class="text-xl font-bold font-orbitron">Missão Solo</h2>
                    <p class="text-sm text-gray-400 mt-2">Teste os seus limites contra a singularidade em modo offline.</p>
                </button>
                <button onclick="mostrarMultiplayer()" class="p-6 border border-purple-500/30 rounded-2xl hover:bg-purple-950/20 transition group">
                    <i data-lucide="wifi" class="w-10 h-10 text-purple-400 mb-4 group-hover:scale-110 transition"></i>
                    <h2 class="text-xl font-bold font-orbitron">Protocolo Rede</h2>
                    <p class="text-sm text-gray-400 mt-2">Conecte-se a salas de simulação ou sabote os seus rivais.</p>
                </button>
            </div>
        </div>
    </div>

    <script>
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'horizonte-supremo';
        const FB = window.FirebaseBridge;

        async function inicializarSistema() {
            try {
                const app = FB.initializeApp(JSON.parse(__firebase_config));
                const auth = FB.getAuth(app);
                if (typeof __initial_auth_token !== 'undefined') {
                    await FB.signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await FB.signInAnonymously(auth);
                }
                console.log("Sistema Quântico Online.");
            } catch (e) {
                console.error("Modo de simulação offline ativo:", e);
            }
        }

        function iniciarJogo(modo) {
            document.getElementById('content').innerHTML = `
                <div class="text-center animate-pulse">
                    <h3 class="text-2xl font-orbitron text-cyan-400">CALIBRANDO SENSORES...</h3>
                </div>`;
            setTimeout(() => {
                document.getElementById('main-view').innerHTML = `
                    <div class="text-center">
                        <h2 class="text-3xl font-orbitron mb-4">MISSÃO INICIADA</h2>
                        <p class="text-gray-400">A singularidade aguarda. Responda rapidamente.</p>
                    </div>`;
            }, 1000);
        }

        function mostrarMultiplayer() {
            document.getElementById('content').innerHTML = `
                <div class="space-y-4">
                    <input type="text" placeholder="PIN DA SALA" class="w-full bg-black border border-cyan-500 p-3 rounded-lg text-center font-orbitron">
                    <button class="w-full py-3 bg-purple-600 rounded-lg font-bold uppercase tracking-widest">Conectar</button>
                </div>`;
        }

        inicializarSistema();
        lucide.createIcons();
    </script>
</body>
</html>
